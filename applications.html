<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JobPilot - Applications</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100..900&display=swap"  rel="stylesheet">
      <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/app.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


<div class="app">


    <header class="topbar">

        <div class="brand">

            <div class="log">

                <i class="fa-solid fa-route"></i>

            </div>

            <span>JobPilot</span>

        </div>


        <button class="join-btn">
            Sign Up
        </button>

    </header>


    <main class="applications-page">


        <div class="application-heading">

            <div>

                <h1>
                    Your Applications
                </h1>

                <p>
                    Track every opportunity you've applied for.
                </p>

            </div>


            <div class="application-total">

                <span id="applicationCount">
                    0
                </span>

                <small>
                    Applications
                </small>

            </div>

        </div>




        <section class="application-tools">


            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="text"
                    class="search-input"
                    placeholder="Search applications..."
                >

            </div>


            <select
                class="search-filter"
                id="statusFilter"
            >

                <option value="all">
                    All
                </option>

                <option value="applied">
                    Applied
                </option>

                <option value="interview">
                    Interview
                </option>

                <option value="offer">
                    Offer
                </option>

                <option value="rejected">
                    Rejected
                </option>

            </select>


        </section>



       
        <section class="application-list">

        

        </section>




        <section
            class="empty-state"
            style="display: none;"
        >

            <i class="fa-solid fa-folder-open"></i>

            <h2>
                No Applications Yet
            </h2>

            <p>
                Browse jobs and apply to your
                first opportunity.
            </p>


            <a
                href="jobs.html"
                class="browse-jobs-btn"
            >

                Browse Jobs

                <i class="fa-solid fa-arrow-right"></i>

            </a>

        </section>


        <div class="page-links">


            <a
                href="opportunities.html"
                class="back-link"
            >

                <i class="fa-solid fa-arrow-left"></i>

                <span>
                    Back to Opportunities
                </span>

            </a>


            <a
                href="interviews.html"
                class="next-link"
            >

                <span>
                    Upcoming Interviews
                </span>

                <i class="fa-solid fa-arrow-right"></i>

            </a>


        </div>


    </main>



</div>


<script src="javascript/auth.js"></script>

<script src="javascript/app.js"></script>


</body>

</html>
